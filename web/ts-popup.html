<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tailscale 연결</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0e0e10; color: #f3f3f5; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .box { max-width: 380px; padding: 24px; text-align: center; }
  .spin { width: 28px; height: 28px; margin: 0 auto 16px; border: 3px solid #444; border-top-color: #ff5d7a;
    border-radius: 50%; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .muted { color: #9a9aa3; font-size: 14px; }
  .err { color: #ff8a8a; }
  button { margin-top: 16px; font: inherit; color: #fff; background: #ff5d7a; border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer; }
</style>
</head>
<body>
<div class="box" id="box"><div class="spin"></div><b>Tailscale 연결 중…</b><p class="muted">잠시만 기다려 주세요. 로그인 화면으로 자동으로 넘어가요.</p></div>
<script>
// 이 창은 관리 화면이 가려져 있어도 스스로 상태를 확인해서 다음 단계로 넘어간다.
const box = document.getElementById('box');
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let stopped = false;
async function tick() {
  if (stopped) return;
  let t;
  try { t = (await (await fetch('/api/admin/status', { cache: 'no-store' })).json()).tailscale; }
  catch { return setTimeout(tick, 1000); }
  if (t.state === 'needs-login' && t.authURL) { stopped = true; location.replace(t.authURL); return; }
  if (t.state === 'needs-funnel' && t.enableURL) { stopped = true; location.replace(t.enableURL); return; }
  if (t.state === 'running') {
    box.innerHTML = t.ready
      ? '<b>✓ 연결 완료!</b><p class="muted">이 창은 닫아도 돼요. 관리 화면에서 주소를 복사하세요.</p><button onclick="window.close()">창 닫기</button>'
      : '<div class="spin"></div><b>거의 다 됐어요</b><p class="muted">인터넷 주소를 준비하고 있어요 (처음 한 번, 1~3분).<br>이 창은 닫아도 돼요.</p>';
    if (t.ready) { setTimeout(() => window.close(), 1500); return; }
  } else if (t.state === 'needs-funnel') {
    box.innerHTML = `<p>${esc(t.enableText || 'Tailscale 관리 화면에서 HTTPS 와 Funnel 을 허용해 주세요.')}</p>`;
  } else if (t.state === 'error') {
    box.innerHTML = `<p class="err">${esc(t.error)}</p><p class="muted">관리 화면에서 "다시 시도" 를 눌러 주세요.</p>`;
    return;
  } else if (t.state === 'off') {
    box.innerHTML = '<p class="muted">외부 공유가 꺼져 있어요. 이 창을 닫아 주세요.</p>';
    return;
  }
  setTimeout(tick, 1000);
}
tick();
</script>
</body>
</html>
